<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Label Editor - 210x170mm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>


<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">Citizen Label Pro</div>
            <div class="toolbar">
                <button id="btn-undo" title="Deshacer">↩</button>
                <button id="btn-redo" title="Rehacer">↪</button>
                <div class="divider"></div>
                <select id="label-mode">
                    <option value="single">Etiqueta Única (210x170)</option>
                    <option value="double">Etiqueta Doble (2x 210x85)</option>
                </select>
                <div class="divider"></div>
                <div class="toolbar-item">
                    <label>Cant. Etiquetas:</label>
                    <input type="number" id="print-qty" value="1" min="1" style="width: 60px;">
                </div>
                <div class="divider"></div>
                <button id="btn-export-pdf" class="primary-btn">Exportar PDF</button>
                <button id="btn-print" class="secondary-btn" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">Imprimir</button>
            </div>
        </header>

        <main class="app-body">
            <aside class="sidebar left-sidebar">
                <div class="tool-group">
                    <h3>Elementos</h3>
                    <button class="tool-btn" id="add-text"><span>📝</span> Texto</button>
                    <button class="tool-btn" id="add-counter" class="accent-btn"><span>🔢</span> Contador</button>
                    <button class="tool-btn" id="add-image"><span>🖼️</span> Imagen</button>
                    <button class="tool-btn" id="add-table"><span>📋</span> Insertar Tabla</button>
                </div>

                <div class="tool-group">
                    <h3>Formas</h3>
                    <div class="tool-grid">
                        <button class="tool-btn-mini" id="add-rect" title="Rectángulo relleno">⬛</button>
                        <button class="tool-btn-mini" id="add-circle" title="Círculo relleno">⚪</button>
                        <button class="tool-btn-mini" id="add-line" title="Línea">➖</button>
                        <button class="tool-btn-mini" id="add-rect-outline" title="Rectángulo vacío">⬜</button>
                        <button class="tool-btn-mini" id="add-circle-outline" title="Círculo vacío">⭕</button>
                    </div>
                </div>

                <div class="tool-group">
                    <h3>Importar</h3>
                    <button class="tool-btn" id="add-pdf"><span>📄</span> PDF a Editable</button>
                    <button class="tool-btn" id="add-excel"><span>📊</span> Excel a Tabla</button>
                </div>

                <div class="tool-group">
                    <h3>Lienzo</h3>
                    <button class="tool-btn danger-outline" id="btn-clear"><span>🗑️</span> Borrar Todo</button>
                    <button class="tool-btn" id="btn-duplicate-double"><span>➕</span> Duplicar en etiqueta inferior</button>
                    <div class="zoom-controls">
                        <button id="zoom-out">-</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in">+</button>
                    </div>
                </div>

                <div class="tool-group">
                    <h3>Atajos</h3>
                    <p><small>Supr: Eliminar</small></p>
                    <p><small>Ctrl+C/V: Copiar</small></p>
                </div>
                <input type="file" id="img-upload" style="display:none" accept="image/*">
                <input type="file" id="pdf-upload" style="display:none" accept="application/pdf">
                <input type="file" id="excel-upload" style="display:none" accept=".xlsx, .xls, .csv">
            </aside>

            <section class="canvas-area">
                <div id="canvas-wrapper">
                    <canvas id="label-canvas"></canvas>
                </div>
            </section>

            <aside class="sidebar right-sidebar" id="properties-panel">
                <div class="tool-group">
                    <h3>Propiedades</h3>
                    <div id="no-selection" class="empty-state">Selecciona un elemento</div>
                    <div id="prop-controls" style="display:none">
                        <div class="prop-row">
                            <label>X (mm)</label>
                            <input type="number" id="prop-x" step="0.1">
                        </div>
                        <div class="prop-row">
                            <label>Y (mm)</label>
                            <input type="number" id="prop-y" step="0.1">
                        </div>
                        <div class="prop-row">
                            <label>Ancho (mm)</label>
                            <input type="number" id="prop-w" step="0.1">
                        </div>
                        <div class="prop-row">
                            <label>Alto (mm)</label>
                            <input type="number" id="prop-h" step="0.1">
                        </div>
                        <div class="prop-row">
                            <label>Rotación (°)</label>
                            <input type="number" id="prop-rotate" step="1">
                        </div>
                        <div id="text-props" style="display:none">
                            <div class="prop-row">
                                <label>Fuente</label>
                                <select id="prop-font">
                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                    <option value="Verdana">Verdana</option>
                                </select>
                            </div>
                            <div class="prop-row">
                                <label>Tamaño</label>
                                <input type="number" id="prop-size">
                            </div>
                            <div class="prop-row">
                                <button id="prop-bold" title="Negrita"><b>B</b></button>
                                <button id="prop-italic" title="Cursiva"><i>I</i></button>
                            </div>
                            <div class="prop-row checkbox-row">
                                <label><input type="checkbox" id="prop-is-counter"> Es Numeración (1, 2, 3...)</label>
                            </div>
                        </div>
                        <div class="prop-row">
                            <label>Color</label>
                            <input type="color" id="prop-color">
                        </div>
                        <div class="prop-row" style="flex-direction: row; gap: 10px;">
                            <button id="btn-forward" title="Traer Adelante" style="flex:1; padding: 5px; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 4px; cursor: pointer;">🔼</button>
                            <button id="btn-backward" title="Enviar Atrás" style="flex:1; padding: 5px; background: #2a2a2a; border: 1px solid var(--border); color: white; border-radius: 4px; cursor: pointer;">🔽</button>
                        </div>
                        <button id="btn-crop" style="width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; margin-top: 5px;">✂️ Iniciar Recorte</button>
                        <button id="btn-confirm-crop" style="width: 100%; padding: 8px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; margin-top: 5px;">✅ Confirmar Recorte</button>
                        <button id="btn-delete" class="danger-btn">Eliminar Elemento</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <div id="loading-overlay" class="loading-overlay" style="display:none">
        <div class="loader-content">
            <div class="spinner"></div>
            <p>Generando etiquetas... <span id="progress-text">0%</span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
